    <title>{% block title %}The Pythonistas{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
    <!-- Navigation bar for each page -->
     <nav>
        <a href="{{ url_for('index') }}">Home</a>

        <a href="#">Blog</a>

</html>
